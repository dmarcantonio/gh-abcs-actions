name: Build Docker Image

on:
    push:
        branches: [ secret-deploy-test ]
permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [default]
        include:
          - secrets: |
              FOO=I_AM_A_SECRET_LOOK_AT_ME
              BAR=ANOTHER_SECRET
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build minimal image with secret
        uses: dmarcantonio/action-builder-ghcr@main
        with:
            package: default
            build_context: .
            build_file: ./Dockerfile
            tags: |
                ${{ github.sha }}
            secrets: ${{ matrix.secrets }}